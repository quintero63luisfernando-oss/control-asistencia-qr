
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de asistencia</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 20px auto;
      padding: 16px;
      text-align: center;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #mensaje {
      overflow-wrap: anywhere;
      padding: 12px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h2>Control de asistencia</h2>
  <p>Coloca tu código QR frente a la cámara.</p>

  <div id="reader"></div>
  <p id="mensaje">Pulsa «Iniciar cámara» para comenzar.</p>
  <button id="iniciar">Iniciar cámara</button>

  <script>
    const URL_APPS_SCRIPT =
      'https://script.google.com/macros/s/AKfycbyCaQXJ6HZzTrGkVz1xqEFddoQ-DsLzrSj6cW5bvQgF29LBubCvrNTmgK8CuFDIJJvNrQ/exec';

    const mensaje = document.getElementById('mensaje');
    const boton = document.getElementById('iniciar');

    let lector = null;
    let procesando = false;

    boton.addEventListener('click', iniciarEscaner);

    async function iniciarEscaner() {
      boton.disabled = true;
      mensaje.textContent = 'Abriendo cámara...';

      try {
        lector = new Html5Qrcode('reader');

        await lector.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 230, height: 230 } },

          async (codigo) => {
            if (procesando) return;
            procesando = true;

            mensaje.textContent =
              'QR leído: ' + codigo + '. Enviando registro...';

            try {
              await lector.stop();

              const url = URL_APPS_SCRIPT +
                '?codigo=' + encodeURIComponent(codigo) +
                '&t=' + Date.now();

              await fetch(url, {
                method: 'GET',
                mode: 'no-cors',
                redirect: 'follow'
              });

              mensaje.textContent =
                'Solicitud enviada para ' + codigo +
                '. Revisa la hoja Control para confirmar el registro.';

            } catch (error) {
              mensaje.textContent =
                'Error de conexión: ' + error.message;
            }

            boton.textContent = 'Escanear siguiente';
            boton.disabled = false;
            boton.onclick = () => location.reload();
          }
        );

        mensaje.textContent = 'Cámara activa. Escanea el QR.';

      } catch (error) {
        mensaje.textContent = 'Error de cámara: ' + error.message;
        boton.disabled = false;
      }
    }
  </script>
</body>
</html>
