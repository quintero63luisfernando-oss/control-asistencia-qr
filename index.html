
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de asistencia</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 20px auto;
      padding: 16px;
      text-align: center;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #mensaje {
      overflow-wrap: anywhere;
      padding: 12px;
      font-weight: bold;
    }

    button {
      padding: 14px 20px;
      margin: 6px;
      font-size: 17px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
    }

    #entrada {
      background: #d9ead3;
    }

    #salida {
      background: #f4cccc;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>
  <h2>Control de asistencia</h2>
  <p>Primero selecciona el movimiento y después escanea tu QR.</p>

  <button id="entrada">ENTRADA</button>
  <button id="salida">SALIDA</button>

  <p id="mensaje">Selecciona Entrada o Salida para comenzar.</p>
  <div id="reader"></div>

  <button id="reiniciar" hidden>Nuevo registro</button>

  <script>
    const URL_APPS_SCRIPT =
      'https://script.google.com/macros/s/AKfycbyCaQXJ6HZzTrGkVz1xqEFddoQ-DsLzrSj6cW5bvQgF29LBubCvrNTmgK8CuFDIJJvNrQ/exec';

    const mensaje = document.getElementById('mensaje');
    const botonEntrada = document.getElementById('entrada');
    const botonSalida = document.getElementById('salida');
    const botonReiniciar = document.getElementById('reiniciar');

    let lector = null;
    let procesando = false;
    let tipoSeleccionado = '';

    botonEntrada.addEventListener('click', () => seleccionarTipo('Entrada'));
    botonSalida.addEventListener('click', () => seleccionarTipo('Salida'));
    botonReiniciar.addEventListener('click', () => location.reload());

    async function seleccionarTipo(tipo) {
      if (lector || procesando) return;

      tipoSeleccionado = tipo;
      botonEntrada.disabled = true;
      botonSalida.disabled = true;
      mensaje.textContent = tipo.toUpperCase() +
        ': abre la cámara y escanea el QR.';

      try {
        lector = new Html5Qrcode('reader');

        await lector.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 230, height: 230 } },

          async (codigo) => {
            if (procesando) return;
            procesando = true;

            mensaje.textContent =
              'Registrando ' + tipoSeleccionado.toLowerCase() +
              ' para ' + codigo + '...';

            try {
              await lector.stop();

              const url = URL_APPS_SCRIPT +
                '?codigo=' + encodeURIComponent(codigo) +
                '&tipo=' + encodeURIComponent(tipoSeleccionado) +
                '&t=' + Date.now();

              await fetch(url, {
                method: 'GET',
                mode: 'no-cors',
                redirect: 'follow'
              });

              mensaje.textContent =
                'SOLICITUD ENVIADA: ' +
                tipoSeleccionado.toUpperCase() +
                ' para ' + codigo +
                '. Comprueba Google Sheets para confirmar.';

            } catch (error) {
              mensaje.textContent =
                'Error al enviar el registro: ' + error.message;
            }

            botonReiniciar.hidden = false;
          }
        );

      } catch (error) {
        mensaje.textContent = 'Error de cámara: ' + error.message;
        botonEntrada.disabled = false;
        botonSalida.disabled = false;
        lector = null;
      }
    }
  </script>
</body>
</html>
